# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Environment variables — prefer Firebase Console: App Hosting → Backend → Settings → Environment.
# (Console overrides values defined here.) Duplicate SMTP_* keys here AND in the console can fail rollouts.
#
# Optional — uncomment example entries ONLY if those variables are not already defined in the console:
#
# env:
#   - variable: STORAGE_BUCKET
#     value: mybucket.app
#     availability:
#       - BUILD
#       - RUNTIME
#
# Secrets:
#   npx -y firebase-tools@latest apphosting:secrets:set SMTP_PASS --data-file=-
#   firebase apphosting:secrets:grantaccess ...
#
#   - variable: SMTP_PASS
#     secret: SMTP_PASS
#     availability:
#       - BUILD
#       - RUNTIME
